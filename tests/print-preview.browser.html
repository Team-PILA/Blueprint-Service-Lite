<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/print.css" />
    <style>
      @media print {
        #result {
          display: none;
        }
      }
    </style>
    <title>Print renderer browser test</title>
  </head>
  <body>
    <main id="print-pages" class="print-pages"></main>
    <output id="result">Ejecutando…</output>
    <script type="module">
      import { PRINT_LAYERS, renderPrintPreview } from "../assets/js/print-renderer.js";

      const phases = Array.from({ length: 10 }, (_, index) => ({
        id: `F${index + 1}`,
        name: `Fase ${index + 1}`,
        description: index === 0 ? "Descripción\nmultilínea" : "",
        layers: Object.fromEntries(
          PRINT_LAYERS.map(({ key }) => [key, index === 1 ? [] : ["Línea uno", "Línea dos"]]),
        ),
      }));
      const blueprint = {
        metadata: {
          service: "Servicio QA",
          owner: "Equipo QA",
          date: "2026-10-14",
          stage: "To-Be",
          description: "Documento de verificación",
        },
        phases,
      };

      const root = document.querySelector("#print-pages");
      const model = renderPrintPreview(root, blueprint);
      const pages = [...root.querySelectorAll(".print-page")];
      const passed =
        model.pageCount === 3 &&
        pages.length === 3 &&
        pages.every((page) => page.querySelectorAll("tr").length === 7) &&
        pages.every((page) => page.querySelector(".print-layer-label")) &&
        !root.querySelector("textarea, input, button") &&
        pages.flatMap((page) => [...page.querySelectorAll(".print-phase-id")]).length === 10;

      document.body.dataset.test = passed ? "passed" : "failed";
      document.querySelector("#result").textContent = passed ? "PASS" : "FAIL";
    </script>
  </body>
</html>
